<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="'Departure Mono','Iosevka Term','JetBrains Mono',Consolas,'Courier New',monospace" font-size="15">
  <style>
    .fg{fill:#B8C4CE}.ac{fill:#8CABC6}.dim{fill:#4A5866}
    .box{fill:#000000;stroke:#4A5866;stroke-width:1}
    .boxac{fill:#000000;stroke:#8CABC6;stroke-width:1}
    .flow{fill:none;stroke:#8CABC6;stroke-width:1;stroke-dasharray:4 6;animation:flow 2.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-20}}
    .lab{font-size:12px}
    .h{font-size:13px;letter-spacing:2px}
    .big{font-size:17px}
  </style>
  <rect width="1000" height="520" fill="#000000"/>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#8CABC6" stroke-width="1"/>
    </marker>
  </defs>

  <text class="dim h" x="40" y="36">HOW IT FITS TOGETHER</text>
  <text class="dim" x="40" y="58">. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>

  <!-- 1 folders -->
  <rect class="box" x="40" y="100" width="260" height="150"/>
  <text class="ac h" x="56" y="122">1  YOUR FOLDERS</text>
  <text class="fg big" x="56" y="152">10_uni/   20_work/</text>
  <text class="fg big" x="56" y="176">30_venture/   ...</text>
  <text class="dim lab" x="56" y="206">one folder per life area,</text>
  <text class="dim lab" x="56" y="224">one CLAUDE.md per project</text>
  <text class="dim lab" x="56" y="242">(what it is, where it stands)</text>

  <!-- 2 STATE.md -->
  <rect class="boxac" x="370" y="100" width="260" height="150"/>
  <text class="ac h" x="386" y="122">2  STATE.md</text>
  <text class="fg big" x="386" y="152">one generated file</text>
  <text class="dim lab" x="386" y="182">all projects, aliases,</text>
  <text class="dim lab" x="386" y="200">deadlines, open items.</text>
  <text class="dim lab" x="386" y="218">rebuilt on every commit.</text>
  <text class="dim lab" x="386" y="242">the AI reads this. nothing else.</text>

  <!-- 3 terminal -->
  <rect class="box" x="700" y="100" width="260" height="150"/>
  <text class="ac h" x="716" y="122">3  THE TERMINAL</text>
  <text class="fg big" x="716" y="152">launcher + panel</text>
  <text class="dim lab" x="716" y="182">one key per area -> project</text>
  <text class="dim lab" x="716" y="200">-> claude code starts there</text>
  <text class="dim lab" x="716" y="218">panel: clock, limits,</text>
  <text class="dim lab" x="716" y="236">burn curve, open tabs</text>

  <!-- arrows 1->2->3 -->
  <path class="flow" d="M300,175 L370,175" marker-end="url(#a)"/>
  <text class="dim lab" x="312" y="166">scan</text>
  <path class="flow" d="M630,175 L700,175" marker-end="url(#a)"/>
  <text class="dim lab" x="642" y="166">read</text>

  <!-- loop back: session updates CLAUDE.md -->
  <path class="flow" d="M830,250 L830,300 L170,300 L170,250" marker-end="url(#a)"/>
  <text class="dim lab" x="260" y="292">session ends -> project CLAUDE.md updated -> STATE.md rebuilt</text>

  <!-- extras -->
  <text class="dim h" x="40" y="360">ALSO IN THE BOX</text>
  <text class="fg" x="40" y="392">/council</text>
  <text class="dim lab" x="160" y="392">same question to claude, gpt, nemotron, llama, qwen -- synthesis + where they disagree</text>
  <text class="fg" x="40" y="416">hub.html</text>
  <text class="dim lab" x="160" y="416">self-contained dashboard: gauges, heatmap, life graph</text>
  <text class="fg" x="40" y="440">statusline</text>
  <text class="dim lab" x="160" y="440">one line in claude code ([wired] AREA | project) that also feeds the panel</text>
  <text class="fg" x="40" y="464">skills</text>
  <text class="dim lab" x="160" y="464">/briefing, /dual, /council -- see claude/skills</text>

  <text class="dim lab" x="40" y="500">plain files + git + powershell. no database, no daemon, no framework.</text>
</svg>
