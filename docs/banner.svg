<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" font-family="'Departure Mono','Iosevka Term','JetBrains Mono',Consolas,'Courier New',monospace">
  <style>
    .fg{fill:#B8C4CE}.ac{fill:#8CABC6}.dim{fill:#4A5866}
    .t{font-size:26px;letter-spacing:3px}
    .s{font-size:17px;letter-spacing:1px}
    #title-clip rect{animation:type 1.6s steps(10,end) .4s both}
    @keyframes type{from{width:0}to{width:330px}}
    #sub{animation:fade .01s 2.3s both}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    #cur{animation:blink 1s steps(1,end) 2.3s infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  </style>
  <rect width="1200" height="200" fill="#000000"/>
  <text class="dim s" x="60" y="52">. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
  <clipPath id="title-clip"><rect x="60" y="74" width="330" height="44"/></clipPath>
  <text class="fg t" x="60" y="106" clip-path="url(#title-clip)">COPLAND OS</text>
  <text id="sub" class="dim s" x="60" y="138">present day. present time.<tspan id="cur" class="ac">_</tspan></text>
  <text class="dim s" x="60" y="172">. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .</text>
</svg>
